services:
  server:
    build: ./server
    ports:
      - '8000:8000'
    command: yarn start --host 0.0.0.0
    volumes:
      - ./server:/app
      - /app/node_modules

  bank-app:
    build: ./bank-app
    ports:
      - '3000:3000'
      - '6006:6006'
    volumes:
      - ./bank-app:/app
      - /app/node_modules
